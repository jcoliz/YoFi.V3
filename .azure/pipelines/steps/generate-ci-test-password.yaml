#
# Generate CI test password
#
# Creates a random password for functional tests and stores it as a secret pipeline variable named testPword.
#
steps:
- pwsh: |
    $upperChars = [char[]]([char]65..[char]90)
    $lowerChars = [char[]]([char]97..[char]122)
    $digitChars = [char[]]([char]48..[char]57)
    $specialChars = [char[]]([char]33..[char]47 + [char]58..[char]64 + [char]91..[char]96 + [char]123..[char]126)
    $allChars = [char[]]($upperChars + $lowerChars + $digitChars + $specialChars)

    $pwordChars = New-Object System.Collections.Generic.List[char]
    $pwordChars.Add(($upperChars | Get-Random))
    $pwordChars.Add(($lowerChars | Get-Random))
    $pwordChars.Add(($digitChars | Get-Random))
    $pwordChars.Add(($specialChars | Get-Random))

    for ($i = 4; $i -lt 24; $i++) {
      $pwordChars.Add(($allChars | Get-Random))
    }

    $pword = -join ($pwordChars | Sort-Object { Get-Random })
    $hash = (Get-FileHash -InputStream ([System.IO.MemoryStream]::new([System.Text.Encoding]::UTF8.GetBytes($pword))) -Algorithm SHA256).Hash

    Write-Host "DEBUG: generated testPword SHA256 = $hash"
    Write-Host "DEBUG: testPword length = $($pword.Length)"
    Write-Host "##vso[task.setvariable variable=testPword;issecret=true]$pword"
  displayName: 'Generate CI test password'