#
# Push the tested images and publish the Compose project to Docker Hub.
#
# REQUIRED VARIABLES:
# - dockerRegistryEndpoint: Docker Hub Docker Registry service connection name
# - dockerUserName: Docker Hub username or organization (without a trailing slash)
#

steps:
- task: Docker@2
  displayName: 'Log in to Docker Hub'
  inputs:
    command: login
    containerRegistry: $(dockerRegistryEndpoint)
- pwsh: |
    & ./scripts/Push-Containers.ps1 -SkipBuild -SkipLogin -PublishProject -Yes
  displayName: 'Push Docker images and publish Compose project to Docker Hub'
  workingDirectory: $(Solution.DefaultWorkingDirectory)
  env:
    SOLUTION_VERSION: $(Solution.Version)
    REGISTRY_PREFIX: $(dockerUserName)/
- task: Docker@2
  displayName: 'Log out of Docker Hub'
  condition: always()
  inputs:
    command: logout
    containerRegistry: $(dockerRegistryEndpoint)
