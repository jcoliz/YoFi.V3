name: yofi-v3-persistent

services:
  dashboard:
    extends:
      file: docker-compose-ci.yml
      service: dashboard
    ports: !override
      - '18810:18888'

  frontend:
    extends:
      file: docker-compose-ci.yml
      service: frontend
    # The static frontend embeds the API URL, so keep its image separate from CI.
    image: ${REGISTRY_PREFIX:-}yofi-v3-frontend-persistent:${SOLUTION_VERSION:-local}
    build:
      tags: !override
        - ${REGISTRY_PREFIX:-}yofi-v3-frontend-persistent:latest
      args:
        NUXT_PUBLIC_API_BASE_URL: http://localhost:5101
    ports: !override
      - '5100:80'

  backend:
    extends:
      file: docker-compose-ci.yml
      service: backend
    environment:
      STARTUP__ALLOWEDCORSORIGINS__0: http://localhost:5100
      IDENTITYSEEDER__ENVIRONMENT__USERS__0__PASSWORD:
      JWT__LIFESPAN: 00:02:30
    ports: !override
      - '5101:8080'

  db:
    extends:
      file: docker-compose-ci.yml
      service: db
    tmpfs: !reset []
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
