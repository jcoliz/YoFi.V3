name: yofi-v3
services:
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - '18800:18888'  # Dashboard UI
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    restart: unless-stopped
  frontend:
    image: ${REGISTRY_PREFIX:-}yofi-v3-frontend:${SOLUTION_VERSION:-local}
    build:
      context: ../src/FrontEnd.Nuxt
      dockerfile: ./docker/Dockerfile
      tags:
        - ${REGISTRY_PREFIX:-}yofi-v3-frontend:latest
      args:
          # Set the API base URL for the frontend to point to the backend service, from the
          # perspective of JS code running in user's browser, *not* from the perspective of
          # within the container.
        - NUXT_PUBLIC_API_BASE_URL=http://localhost:5001
        - NUXT_PUBLIC_SOLUTION_VERSION=${SOLUTION_VERSION:-container}
        - NUXT_PUBLIC_APPLICATION_INSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    restart: unless-stopped
    ports:
      - '5000:80'
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: ${REGISTRY_PREFIX:-}yofi-v3-backend:${SOLUTION_VERSION:-local}
    build:
      context: ..
      dockerfile: ./docker/BackEnd.dockerfile
      tags:
        - ${REGISTRY_PREFIX:-}yofi-v3-backend:latest
      args:
        - SOLUTION_VERSION=${SOLUTION_VERSION:-container}
    environment:
      - ASPNETCORE_ENVIRONMENT=Container
      - STARTUP__ALLOWEDCORSORIGINS__0=http://localhost:5000
      - APPLICATION_INSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=yofi-backend
      - ConnectionStrings__DefaultConnection=Host=db;Database=db;Username=postgres;Password=development
      - IDENTITYSEEDER__ENVIRONMENT__USERS__0__PASSWORD=${TESTPWORD:-}
    restart: unless-stopped
    ports:
      - '5001:8080'
    depends_on:
      dashboard:
        condition: service_started
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    tmpfs:
      - /var/lib/postgresql/data
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=development
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - PGUSER=postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "db" ]
      interval: 1s
      timeout: 5s
      retries: 10
